<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Lost & Found Buddy</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script type="module" src="app.js"></script>
</head>
<body>

  <div class="container">
    <h1>🔍 Lost & Found Buddy</h1>

    <!-- Login / Register -->
    <div id="auth">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="register()">สมัครสมาชิก</button>
      <button onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- App -->
    <div id="app" style="display:none;">
      <h2>เพิ่มรายการของหาย / ของที่พบ</h2>

      <input type="text" id="title" placeholder="ชื่อสิ่งของ">
      <input type="text" id="description" placeholder="รายละเอียด">
      <select id="type">
        <option value="lost">ของหาย</option>
        <option value="found">ของที่พบ</option>
      </select>

      <button onclick="addItem()">บันทึก</button>
      <button onclick="logout()">ออกจากระบบ</button>

      <h3>รายการทั้งหมด</h3>
      <ul id="list"></ul>
    </div>
  </div>

</body>
</html>
