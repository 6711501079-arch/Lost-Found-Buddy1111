<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Buddy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-search-location"></i>
            <h1>Lost & Found Buddy</h1>
        </div>
        <div id="user-menu" class="hidden">
            <span id="user-email"></span>
            <button id="logout-btn" class="btn btn-outline">ออกจากระบบ</button>
        </div>
    </nav>

    <main class="container">
        <div id="auth-section" class="card auth-card">
            <img src="<img src="IMG_9594.jpg" alt="App Logo" style="width: 120px; margin: 0 auto 20px auto; display: block; border-radius: 12px;">" alt="App Logo" style="width: 120px; margin: 0 auto 20px auto; display: block; border-radius: 12px;">
            <h2>เข้าสู่ระบบเพื่อเริ่มใช้งาน</h2>
            <form id="auth-form">
                <div class="input-group">
                    <label>อีเมล</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="password" required placeholder="รหัสผ่าน 6 ตัวขึ้นไป">
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
                <button type="button" id="register-btn" class="btn btn-secondary w-100 mt-10">สมัครสมาชิกใหม่</button>
            </form>
            <p id="auth-error" class="error-text hidden"></p>
        </div>

        <div id="app-section" class="hidden">
            <div class="action-bar">
                <h2>รายการของหาย / พบของ</h2>
                <button id="show-add-modal-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> แจ้งรายการใหม่
                </button>
            </div>
            
            <div id="items-grid" class="grid-container">
                </div>
        </div>
    </main>

    <div id="add-modal" class="modal hidden">
        <div class="modal-content card">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>แจ้งรายการใหม่</h2>
            <form id="add-item-form">
                <div class="input-group">
                    <label>ประเภท</label>
                    <select id="item-type" required>
                        <option value="lost">ของหาย (Lost)</option>
                        <option value="found">พบของ (Found)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>ชื่อสิ่งของ</label>
                    <input type="text" id="item-title" required placeholder="เช่น กระเป๋าสตางค์สีดำ">
                </div>
                <div class="input-group">
                    <label>รายละเอียด / สถานที่</label>
                    <textarea id="item-desc" rows="3" required placeholder="พบที่ไหน หรือหายที่ไหน มีจุดสังเกตอะไรบ้าง"></textarea>
                </div>
                <div class="input-group">
                    <label>เบอร์ติดต่อ (หรือช่องทางติดต่อ)</label>
                    <input type="text" id="item-contact" required placeholder="เบอร์โทรหรือ Line ID">
                </div>
                <button type="submit" class="btn btn-primary w-100">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
