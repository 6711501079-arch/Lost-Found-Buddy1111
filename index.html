<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found Buddy - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Lost & Found Buddy</span>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="auth-card">
            
            <div class="auth-logo-container">
                <img src="logo-placeholder.png" alt="L & F BUDDY Logo" class="auth-logo-img">
                <span class="auth-brand-name">L & F BUDDY</span>
            </div>

            <h2>เข้าสู่ระบบเพื่อเริ่มใช้งาน</h2>

            <form class="auth-form" action="#" method="POST">
                <div class="input-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" placeholder="รหัสผ่าน 6 ตัวขึ้นไป" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary w-100">เข้าสู่ระบบ</button>
                <button type="button" class="btn btn-secondary w-100 mt-10">สร้างบัญชีใหม่</button>
            </form>

            <div class="auth-footer">
                <div class="stat-item">
                    <span class="stat-icon lost"><i class="fa-solid fa-box-archive"></i></span>
                    <span>ประกาศของหาย (15)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon found"><i class="fa-solid fa-square-check"></i></span>
                    <span>ประกาศพบของ (8)</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
