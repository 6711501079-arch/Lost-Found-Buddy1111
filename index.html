<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found Buddy</title>

  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
</head>

<body>

  <div class="container">

    <h1>🔍 Lost & Found Buddy</h1>

    <!-- Login Section -->
    <div id="auth-section">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">

      <button onclick="register()">สมัครสมาชิก</button>
      <button onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- App Section -->
    <div id="app-section" class="hidden">
      <h2>โพสต์ของหาย / ของที่พบ</h2>

      <input type="text" id="title" placeholder="ชื่อสิ่งของ">
      <input type="text" id="detail" placeholder="รายละเอียด">
      <select id="type">
        <option value="lost">ของหาย</option>
        <option value="found">ของที่พบ</option>
      </select>

      <button onclick="addPost()">➕ เพิ่มโพสต์</button>
      <button onclick="logout()">🚪 ออกจากระบบ</button>

      <h3>📋 รายการทั้งหมด</h3>
      <div id="post-list"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
