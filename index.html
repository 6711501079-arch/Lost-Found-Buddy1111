<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found Buddy</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">

    <h1>🔍 Lost & Found Buddy</h1>

    <!-- Login -->
    <div id="login-section">
      <button id="loginBtn">Login with Google</button>
    </div>

    <!-- User Info -->
    <div id="user-section" class="hidden">
      <p id="userName"></p>
      <button id="logoutBtn">Logout</button>
    </div>

    <!-- Post Form -->
    <div id="post-section" class="hidden">
      <h2>📌 แจ้งของหาย / ของที่พบ</h2>

      <input type="text" id="title" placeholder="ชื่อสิ่งของ">
      <textarea id="description" placeholder="รายละเอียด"></textarea>

      <select id="type">
        <option value="lost">ของหาย</option>
        <option value="found">ของที่พบ</option>
      </select>

      <button id="postBtn">โพสต์</button>
    </div>

    <!-- List -->
    <div id="list">
      <h2>📋 รายการ</h2>
      <div id="posts"></div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <script src="app.js"></script>

</body>
</html>
